[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "docflow"
version = "0.1.0"
description = "AI-powered document workflow automation for vendor invoices and purchase requests"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pgvector>=0.2",
    "google-generativeai>=0.7",
    "google-adk>=0.3",
    "supabase>=2.4",
    "pdfplumber>=0.11",
    "pytesseract>=0.3",
    "Pillow>=10",
    "reportlab>=4",
    "rapidfuzz>=3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "streamlit>=1.35",
    "duckdb>=0.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
    "faker>=24",
    "factory-boy>=3.3",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
