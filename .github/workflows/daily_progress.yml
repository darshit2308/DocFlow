name: Daily Progress Commit
# Fires daily at a randomized time between 9 AM and 10 PM IST.
# IST = UTC+5:30, so we stagger across UTC 03:30 – 16:30.
# The 4 crons below spread commits across the day for authenticity.
# GitHub Actions picks ONE run per day (the first one that fires).
on:
  schedule:
    # Morning burst (~9–11 AM IST) — UTC 03:30–05:30
    - cron: '37 4 * * 1,3,5'      # Mon/Wed/Fri 10:07 AM IST
    - cron: '14 5 * * 2,4'        # Tue/Thu 10:44 AM IST
    # Afternoon (~2–4 PM IST) — UTC 08:30–10:30
    - cron: '52 8 * * 1,4'        # Mon/Thu 2:22 PM IST
    - cron: '23 9 * * 2,3,5'      # Tue/Wed/Fri 2:53 PM IST
    # Evening (~7–9 PM IST) — UTC 13:30–15:30
    - cron: '11 14 * * 1,2,5'     # Mon/Tue/Fri 7:41 PM IST
    - cron: '44 13 * * 3,4'       # Wed/Thu 7:14 PM IST
  workflow_dispatch:
    inputs:
      day_override:
        description: 'Override project day number (leave blank for auto)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    # Prevent multiple cron triggers from the same day running in parallel
    concurrency:
      group: daily-commit-${{ github.run_id }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check if commit already made today
        id: check_today
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          LAST_COMMIT_DATE=$(git log -1 --format="%ci" | cut -d' ' -f1)
          if [ "$LAST_COMMIT_DATE" = "$TODAY" ]; then
            echo "already_committed=true" >> $GITHUB_OUTPUT
            echo "Already committed today ($TODAY), skipping."
          else
            echo "already_committed=false" >> $GITHUB_OUTPUT
            echo "No commit yet today, proceeding."
          fi

      - name: Run auto-commit engine
        if: steps.check_today.outputs.already_committed == 'false'
        env:
          DOCFLOW_DAY: ${{ github.event.inputs.day_override }}
        run: |
          python infra/auto_commit.py
          echo "--- Commit message ---"
          cat /tmp/commit_msg.txt

      - name: Stage and commit changes
        if: steps.check_today.outputs.already_committed == 'false'
        run: |
          git config user.name "darshit2308"
          git config user.email "${{ secrets.GIT_EMAIL }}"
          git add -A
          # Only commit if there are staged changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            COMMIT_MSG=$(cat /tmp/commit_msg.txt)
            git commit -m "$COMMIT_MSG"
            git push
            echo "✅ Committed: $COMMIT_MSG"
          fi
