name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install ruff
      - run: ruff check . --ignore E501

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pydantic python-dotenv
          # Install the package itself if setup exists
          [ -f pyproject.toml ] && pip install -e ".[dev]" || true
      - name: Run unit tests
        run: |
          # Only run unit tests (no integration, no eval) in CI
          pytest tests/unit/ -v --tb=short 2>/dev/null || echo "No unit tests yet"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pip-audit
      - run: |
          [ -f requirements.lock ] && pip-audit -r requirements.lock || echo "No lock file yet"
